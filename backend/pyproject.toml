[project]
name = "claimlens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "Pillow>=10.3",
  "imagehash>=4.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "engine", "agents"]
